schema_version: "1"

# ===========================================================================
# @omadia/channel-discord — Discord-Bot-Channel (discord.js Gateway)
# ---------------------------------------------------------------------------
# 2.x replaces 0.1.x in place: same id, and turns resolve their Agent the
# way 0.1.5 does (Discord channel id first, then guild id) with the same
# `discord:<channelId>` session scope, so existing bindings and conversation
# memory carry over. Setup shrinks to the bot token; the Application ID, the
# Message Content intent and the invite link are derived from it at runtime.
# ===========================================================================

identity:
  id: "@omadia/channel-discord"
  kind: "channel"
  domain: "discord"
  name: "Discord Channel"
  version: "2.0.0"
  description: "Discord-Bot-Channel. Einrichtung nur mit dem Bot-Token: Application-ID, Einladungslink und Slash-Command ergeben sich automatisch. Antworten kommen als Discord Components V2 — Tabellen werden als Bild mit CSV-Anhang gezeigt statt als umbrochener Markdown-Text, dazu Buttons, Auswahlmenüs und Bilder."
  authors:
    - name: "byte5 GmbH"
      email: "info@omadia.ai"
      url: "https://omadia.ai"
  license: "MIT"
  icon: "./assets/icon.svg"
  categories:
    - "channel"
    - "communication"

compat:
  core: ">=1.0 <2.0"
  node: ">=20"

multi_instance: true

privacy_class: "default"

depends_on: []

# Every capability resolved through `ctx.services.get` must be declared
# (omadia#838; same entries as 0.1.5). `chatAgent@^1` is published by
# @omadia/orchestrator, so the resolver orders it first. `channelResolver@1`
# is published by the kernel, not a plugin: a `requires:` entry would never
# resolve, and its absence is survivable (every turn falls back to the
# default chatAgent).
requires:
  - "chatAgent@^1"
optional_requires:
  - "channelResolver@1"

lifecycle:
  entry: "dist/plugin.js"

admin_ui_path: "/api/discord/admin/index.html"

channel:
  transport:
    kind: "websocket"
    routes: []
    verify_signature: false
  capabilities:
    - "text"
    - "attachments"
    - "interactive_cards"
    - "file_upload"
    - "typing_indicator"
  adapters:
    - "discord_components"
    - "markdown"
    - "text"

setup:
  guide:
    en: |
      ## Create a Discord bot

      All you need is a **bot token**. About two minutes.

      1. Open the [Discord Developer Portal](https://discord.com/developers/applications) → **New Application** → name it (e.g. "Omadia") → **Create**.
      2. Left sidebar → **Bot** → **Reset Token** → **Copy**.
      3. Paste it below as **Discord Bot Token** and install.

      After installing, the plugin page walks you through the rest: it shows the
      bot, gives you the **invite button** for your server and ticks off the
      first conversation. Application ID, slash command and invite link are
      derived from the token.

      The **Message Content Intent** is only needed if the bot should answer
      *every* message in a channel. The plugin page tells you if it is missing.
    de: |
      ## Discord-Bot anlegen

      Du brauchst nur einen **Bot-Token**. Dauert etwa zwei Minuten.

      1. Öffne das [Discord Developer Portal](https://discord.com/developers/applications) → **New Application** → Namen vergeben (z. B. „Omadia“) → **Create**.
      2. Linke Leiste → **Bot** → **Reset Token** → **Copy**.
      3. Unten als **Discord Bot Token** einsetzen und installieren.

      Nach der Installation führt dich die Plugin-Seite durch den Rest: Sie
      zeigt den Bot, gibt dir den **Einladungs-Button** für deinen Server und
      hakt die erste Unterhaltung ab. Application-ID, Slash-Command und
      Einladungslink ergeben sich aus dem Token.

      Den **Message Content Intent** brauchst du nur, wenn der Bot auf *jede*
      Nachricht in einem Kanal antworten soll. Fehlt er, sagt dir das die
      Plugin-Seite.
  # Keys are 0.1.5's, so an in-place upgrade keeps token, policy and
  # allowlist. Dropped: message_content_intent (detected from the token),
  # enable_slash_command (/ask is always registered, per server), ignore_bots
  # (other bots are always ignored).
  fields:
    - key: "discord_bot_token"
      type: "secret"
      label: "Discord Bot Token"
      help: "Discord Developer Portal → deine Application → Bot → Reset Token → Copy. Wird verschlüsselt im Vault gespeichert. Mehr braucht es nicht — den Rest zeigt dir nach der Installation die Plugin-Seite."
      placeholder: "Bot-Token aus dem Developer Portal (Bot → Reset Token)"
      required: true

    - key: "respond_in_guilds"
      type: "enum"
      label: "Verhalten in Servern (Guilds)"
      help: "Wann der Bot in Server-Kanälen antwortet. 'Nur bei @Erwähnung' (Standard; Antworten auf seine Nachrichten zählen mit), 'Auf jede Nachricht' (braucht den Message Content Intent im Developer Portal) oder 'In Servern stumm' (nur Direktnachrichten)."
      required: false
      default: "mention"
      enum:
        - { value: "mention", label: "Nur bei @Erwähnung" }
        - { value: "all", label: "Auf jede Nachricht" }
        - { value: "off", label: "In Servern stumm (nur DMs)" }

    - key: "allow_dms"
      type: "boolean"
      label: "Direktnachrichten zulassen"
      help: "Wenn aktiv, antwortet der Bot in 1:1-Direktnachrichten."
      required: false
      default: true

    - key: "allowlist"
      type: "string"
      label: "Zugelassene IDs (optional)"
      help: "Komma-getrennte Discord-User-IDs und/oder Server-IDs, die den Bot nutzen dürfen — gilt für Nachrichten, /ask und Buttons. Leer = alle. (In Discord Entwicklermodus aktivieren → Rechtsklick → 'ID kopieren'.)"
      required: false
      default: ""

  self_test: false

permissions:
  memory:
    reads: ["agent:@omadia/channel-discord:*"]
    writes: ["agent:@omadia/channel-discord:*"]
  network:
    outbound:
      - "discord.com"
      - "gateway.discord.gg"
      - "cdn.discordapp.com"
  filesystem:
    scratch: false
